<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景：圆角渐变深色 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 一本打开的书 -->
  <g transform="translate(96, 120)">
    <!-- 书脊阴影 -->
    <path d="M160 24 L160 264 L168 264 L168 24 Z" fill="#0f172a" opacity="0.3"/>

    <!-- 左页 -->
    <path d="M8 24 Q8 8 24 8 L160 24 L160 264 L24 248 Q8 248 8 232 Z"
          fill="url(#page)" stroke="#1e293b" stroke-width="2"/>

    <!-- 右页 -->
    <path d="M312 24 Q312 8 296 8 L160 24 L160 264 L296 248 Q312 248 312 232 Z"
          fill="url(#page)" stroke="#1e293b" stroke-width="2"/>

    <!-- 左页文字行 -->
    <g stroke="#475569" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <line x1="40" y1="60" x2="140" y2="68"/>
      <line x1="40" y1="92" x2="140" y2="100"/>
      <line x1="40" y1="124" x2="130" y2="132"/>
      <line x1="40" y1="156" x2="140" y2="164"/>
      <line x1="40" y1="188" x2="120" y2="196"/>
    </g>

    <!-- 右页文字行 -->
    <g stroke="#475569" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <line x1="180" y1="68" x2="280" y2="60"/>
      <line x1="180" y1="100" x2="280" y2="92"/>
      <line x1="180" y1="132" x2="270" y2="124"/>
      <line x1="180" y1="164" x2="280" y2="156"/>
      <line x1="180" y1="196" x2="260" y2="188"/>
    </g>
  </g>

  <!-- 右下角代码符号 -->
  <g transform="translate(280, 320)" fill="none" stroke="#67e8f9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 8 L8 32 L28 56"/>
    <path d="M88 8 L108 32 L88 56"/>
    <line x1="68" y1="0" x2="48" y2="64" stroke="#a5f3fc"/>
  </g>
</svg>
